<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What to Eat?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Figtree:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <header id="title">
      <button type="button" id="settings-btn" class="settings-btn" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>

      <h1>Restaurants Near Me</h1>
      <p class="lede">Pick how far you'll travel and what you're craving.</p>
    </header>
    <section id="restaurants" aria-labelledby="restaurants-heading">
      <h2 id="restaurants-heading">Nearby restaurants</h2>

      <div class="controls">
        <div class="control-group">
          <label for="radius-slider">Search radius: <span id="radius-value">5</span> miles</label>
          <input type="range" id="radius-slider" min="1" max="10" step="1" value="5" />
        </div>

        <fieldset class="control-group">
          <legend>Place types</legend>
          <label><input type="checkbox" name="place-type" value="restaurant" checked /> Restaurants</label>
          <label><input type="checkbox" name="place-type" value="fast_food" /> Fast food</label>
          <label><input type="checkbox" name="place-type" value="cafe" /> Cafes</label>
        </fieldset>

        <button type="button" id="search-btn">Search</button>
        <button id="randomize-btn">Decide For Me</button>
      </div>
      
      
      <p id="restaurants-status" role="status"></p>

      <ul id="restaurants-list">
        <!-- restaurant items get inserted here by script.js -->
      </ul>

      <p id="restaurants-empty" hidden>No restaurants found nearby.</p>
    </section>

    <footer class="site-footer">
      <p class="footer-line">
        <span class="footer-brand">What to Eat?</span>
        <span>&copy; 2026</span>
      </p>
      <p class="fine-print">
        Place data from
        <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>,
        provided by <a href="https://www.geoapify.com/">Geoapify</a>.
      </p>
    </footer>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-box">
        <h2 id="settings-title">Settings</h2>

        <div class="setting-row">
          <label for="volume-slider">Volume: <span id="volume-value">50</span>%</label>
          <input type="range" id="volume-slider" min="0" max="100" step="1" value="50" />
        </div>

        <button type="button" id="settings-close" class="settings-close">Close</button>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
